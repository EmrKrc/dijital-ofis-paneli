<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12332e">
  <meta name="description" content="Nexora örnek operasyon portalı: sefer dosyaları ve cihazda belge inceleme.">
  <title>Nexora | Operasyon Portalı</title>
  <link rel="icon" href="./icons/layers.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip" href="#main">İçeriğe geç</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><strong>Nexora<span>.</span></strong><small>Operasyon portalı</small></div>
      <div class="workspace"><span class="workspace-mark" aria-hidden="true">D</span><span><strong>Demo çalışma alanı</strong><small>Örnek lojistik operasyonu</small></span></div>
      <nav id="nav" aria-label="Çalışma alanı"></nav>
      <div class="side-bottom">
        <button class="help-button" data-action="help" data-testid="help">Nasıl kullanılır?</button>
        <div class="side-note"><span class="live-dot"></span> Kurgusal veri ile çalışıyor</div>
      </div>
    </aside>
    <div class="app">
      <header class="topbar"><div id="crumb"></div><div class="top-end"><span class="toplabel" id="local-label"></span><button id="reset-btn" class="btn btn-subtle" data-action="reset" data-testid="reset"></button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer>© 2026 Nexora <span>Kurgusal demo · Oturum verileri sayfa yenilenince sıfırlanır.</span></footer>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
